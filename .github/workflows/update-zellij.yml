name: Update zellij

# Bumps the pinned zellij version in files/scripts/install-zellij.sh when
# upstream cuts a release, and pushes straight to the default branch.
#
# Runs at 05:30 UTC, half an hour before the image build cron (00 06 * * *).
# Pushes made with GITHUB_TOKEN deliberately do not trigger other workflows,
# so the bump does not build immediately -- the 06:00 build picks it up. That
# keeps the image current within a day without needing a PAT.

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    name: Bump pinned zellij version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream release and bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          script=files/scripts/install-zellij.sh

          current="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' "$script")"
          [ -n "$current" ] || { echo "could not read VERSION from $script" >&2; exit 1; }

          tag="$(gh api repos/zellij-org/zellij/releases/latest -q .tag_name)"
          latest="${tag#v}"
          echo "current=$current latest=$latest"

          if [ "$current" = "$latest" ]; then
            echo "Already on the latest release; nothing to do."
            exit 0
          fi

          # Do not bump onto a release that lacks the assets the installer needs
          # -- that would break every nightly build until someone noticed.
          base="https://github.com/zellij-org/zellij/releases/download/${tag}"
          for asset in \
              "zellij-x86_64-unknown-linux-musl.tar.gz" \
              "zellij-x86_64-unknown-linux-musl.sha256sum"; do
            if ! curl -fsSL -o /dev/null --head "${base}/${asset}"; then
              echo "Release ${tag} is missing ${asset}; skipping bump." >&2
              exit 0
            fi
          done

          sed -i "s/^VERSION=\".*\"$/VERSION=\"${latest}\"/" "$script"
          grep '^VERSION=' "$script"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$script"
          git commit -m "Bump zellij to ${latest}"
          git push
