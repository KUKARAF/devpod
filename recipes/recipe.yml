---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/kukaraf/devpod
name: devpod
description: Personal Fedora Silverblue image.

labels:
  ostree.bootable: "true"

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 44

# module configuration, executed in order
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: gschema-overrides
    include:
      - zz1-defaults.gschema.override

  - type: bling
    install:
      - dconf-update-service

  - type: rpm-ostree
    repos:
      - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
      - https://cli.github.com/packages/rpm/gh-cli.repo
      # Terra: ghostty is not packaged in Fedora
      - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      # GUI apps belong in the host image so they get host Mesa/OpenGL.
      # Running ghostty from nix-in-toolbox fails to create an EGL display.
      - ghostty
      - tailscale
      - gh
      - stow
      - btop
      - syncthing
      - fzf
      - steam-devices
      - uv
      # gum powers the devpod-apps first-login picker
      - gum

      # Carried over from the thinkpad's rpm-ostree layering. vim-enhanced,
      # ncurses-term and fuse are already in the ublue base, so they are not
      # repeated here. gvim is provided by vim-X11.
      - chromium
      - vim-X11
      - inotify-tools
      - ibus-speech-to-text
      - android-tools
      - waydroid

  - type: systemd
    system:
      enabled:
        - tailscaled.service

  - type: script
    no-cache: true
    scripts:
      - install-vim-plugins.sh
      # Everything in files/scripts/root_bins.toml, tracking latest.
      - install-root-bins.sh

  - type: signing
